plugins {
    id "com.android.application"
}
android {
    namespace "de.phbouillon.android.games.alite"
    compileSdk 35
    defaultConfig {
        applicationId "de.phbouillon.android.games.alite"
        minSdk 21
        // Android 15 blocks apps targeting below API 24. Retain 28 pending
        // an audit of storage, alarm, and notification behavior.
        targetSdk 28
        versionCode 2300
        versionName "1.5.9"
    }
    sourceSets {
        main {
            manifest.srcFile "../AndroidManifest.xml"
            java.srcDirs = ["../src"]
            res.srcDirs = ["../res"]
            assets.srcDirs = ["../assets"]
            jniLibs.srcDirs = ["../libs"]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    packaging {
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE",
                         "META-INF/LICENSE.txt", "META-INF/NOTICE", "META-INF/NOTICE.txt"]
        }
    }
}
dependencies {
    implementation fileTree(dir: "../libs", include: ["*.jar"])
    // The legacy downloader requires the original Apache HttpClient 4.2 API.
    implementation "org.apache.httpcomponents:httpclient:4.2.6"
}
